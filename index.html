<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDX AI // CYBER AUDITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0a0a12;
            color: #39ff14; /* Neon Green */
        }
        .cyber-border {
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px #39ff14, inset 0 0 10px #39ff14;
        }
        .cyber-btn {
            background: linear-gradient(45deg, #ff007f, #39ff14);
            transition: all 0.3s ease;
        }
        .cyber-btn:hover {
            box-shadow: 0 0 25px #ff007f, 0 0 10px #39ff14;
            transform: scale(1.02);
        }
        /* Markdown va kod bloklari dizayni */
        pre { background-color: #05050b; padding: 12px; border-left: 3px solid #ff007f; color: #39ff14; overflow-x: auto; font-family: monospace; margin: 10px 0; }
        code { color: #ff007f; font-family: monospace; background: #1a1a2e; padding: 2px 6px; border-radius: 3px; }
        h3 { color: #ff007f; font-weight: bold; margin-top: 15px; font-size: 1.2rem; }
        ul { list-style-type: square; margin-left: 20px; color: #e0e0e0; }
        li { margin-bottom: 5px; }
    </style>
</head>
<body class="p-6 min-h-screen flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl cyber-border bg-[#0f0f1e] p-8 rounded-none relative overflow-hidden">
        <div class="absolute top-0 right-0 p-2 text-xs text-[#ff007f] font-bold opacity-70">SYSTEM_STATUS: ACTIVE</div>
        
        <h1 class="text-4xl font-extrabold mb-2 text-center text-[#ff007f] tracking-widest uppercase">
            ⚡ VDX AI // CYBER AUDITOR ⚡
        </h1>
        <p class="text-center text-gray-400 mb-8 text-sm">GLOBAL OWASP TOP 10 SECURE SCANNER v2.0</p>

        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="targetUrl" placeholder="https://target-website.com" 
                   class="flex-1 bg-black border border-[#39ff14] px-4 py-3 text-[#39ff14] focus:outline-none focus:ring-2 focus:ring-[#ff007f] text-lg">
            <button onclick="startAudit()" class="cyber-btn text-black font-bold px-8 py-3 text-lg uppercase tracking-wider">
                Skanerlash
            </button>
        </div>

        <div id="loader" class="hidden text-center my-6 animate-pulse text-[#ff007f]">
            [>] MATRIXGA ULANISH... OWASP VA AI TAHLIL KETMOQDA... ILTIMOS KUTING...
        </div>

        <div id="resultContainer" class="hidden mt-8 border-t border-[#39ff14] pt-6">
            <h2 class="text-2xl font-bold mb-4 text-[#ff007f]">// AUDIT HISOBOTI:</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="bg-black p-4 border border-gray-800">
                    <span class="text-gray-400">SSL Status:</span>
                    <p id="sslRes" class="text-white font-bold"></p>
                </div>
                <div class="bg-black p-4 border border-gray-800">
                    <span class="text-gray-400">Ochiq Portlar:</span>
                    <p id="portsRes" class="text-white font-bold"></p>
                </div>
            </div>

            <div class="bg-black p-6 border border-[#39ff14] max-h-96 overflow-y-auto">
                <span class="text-[#ff007f] font-bold">[AI CHUQUR TAHLILI & TAVSIYALAR]</span>
                <div id="aiReport" class="text-gray-300 mt-4 text-sm leading-relaxed"></div>
            </div>
        </div>
    </div>

    <script>
        // SIZNING JONLI BACKEND SERVER MANZILINGIZ (Muvaffaqiyatli ulandi)
        const BACKEND_URL = "https://vdx-saas.onrender.com/api/audit"; 

        // AI dan keladigan markdown matnni terminalbop vizual ko'rinishga keltirish uchun oddiy parser
        function parseMarkdown(text) {
            return text
                .replace(/### (.*?)\n/g, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
                .replace(/\* (.*?)\n/g, '<li>$1</li>')
                .replace(/\n/g, '<br>');
        }

        async function startAudit() {
            const urlInput = document.getElementById('targetUrl').value;
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');

            if(!urlInput) {
                alert("Iltimos, URL manzilini kiriting!");
                return;
            }

            loader.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if(response.ok && data.status === "success") {
                    document.getElementById('sslRes').innerText = data.technical_data.ssl_status;
                    document.getElementById('portsRes').innerText = data.technical_data.open_ports.length > 0 
                        ? data.technical_data.open_ports.join(', ') 
                        : "Barcha standart portlar yopiq";
                    
                    // Kelgan hisobotni kiberpank formatda render qilish
                    document.getElementById('aiReport').innerHTML = parseMarkdown(data.ai_report);
                    resultContainer.classList.remove('hidden');
                } else {
                    alert("Xatolik yuz berdi: " + (data.detail || "Noma'lum xatolik"));
                }
            } catch (error) {
                alert("Serverga ulanib bo'lmadi. Render uyqu rejimida bo'lishi mumkin, 30 soniya kutib qaytadan urinib ko'ring.");
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
