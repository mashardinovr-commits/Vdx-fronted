<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDX AI // Next-Gen Enterprise Cyber Auditor</title>
    <style>
        :root {
            --bg-color: #030307;
            --panel-bg: rgba(10, 10, 22, 0.85);
            --border-color: #1e293b;
            --neon-cyan: #00f2ff;
            --neon-green: #39ff14;
            --neon-rose: #ff0055;
            --neon-purple: #9d4edd;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, 'Courier New', monospace; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 40px 20px;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Cyberpunk Header */
        header { 
            text-align: center; 
            margin-bottom: 50px; 
            position: relative;
            padding-bottom: 25px;
        }
        header h1 { 
            font-size: 3rem; 
            font-weight: 900;
            color: #fff; 
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.6); 
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        header p { 
            color: var(--neon-cyan); 
            font-size: 0.95rem; 
            margin-top: 8px; 
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
        }

        /* Scanner Input Panel */
        .input-panel { 
            background: var(--panel-bg); 
            border: 1px solid rgba(0, 242, 255, 0.2); 
            padding: 30px; 
            border-radius: 8px; 
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.05); 
            margin-bottom: 40px; 
            display: flex; 
            gap: 20px;
            position: relative;
        }
        .input-panel::before {
            content: 'SYS.INPUT';
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-color);
            padding: 0 10px;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        input[type="text"] { 
            flex: 1; 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid var(--border-color); 
            padding: 18px; 
            color: var(--neon-green); 
            font-size: 1.1rem; 
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus { 
            outline: none; 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); 
        }

        button { 
            background: linear-gradient(135deg, transparent 10px, var(--neon-cyan) 0);
            border: none;
            color: #000; 
            padding: 0 40px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-weight: 800; 
            letter-spacing: 1px;
            border-radius: 0 6px 6px 6px;
            transition: all 0.3s ease;
        }
        button:hover { 
            background: linear-gradient(135deg, transparent 10px, var(--neon-green) 0);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
        }

        /* Progress & Live Console */
        .console-box { 
            background: rgba(0, 0, 0, 0.8); 
            border-left: 3px solid var(--neon-cyan);
            border-right: 1px solid rgba(255,255,255,0.05);
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 25px; 
            border-radius: 4px; 
            height: 220px; 
            overflow-y: auto; 
            margin-bottom: 40px; 
            display: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .console-line { 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            margin-bottom: 8px; 
            font-family: 'Courier New', monospace;
        }
        .console-line.active { color: var(--neon-cyan); text-shadow: 0 0 5px rgba(0,242,255,0.3); }
        
        /* Modern Grid Dashboard */
        .results-wrapper { 
            display: none; 
            grid-template-columns: 1fr 1.3fr; 
            gap: 35px; 
            margin-bottom: 40px; 
        }
        
        .panel { 
            background: var(--panel-bg); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 30px; 
            border-radius: 8px; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .panel h2 { 
            color: #fff; 
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel h2::before {
            content: '//';
            color: var(--neon-cyan);
        }
        
        /* Score Widget */
        .score-box {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 25px;
        }
        .big-score { 
            font-size: 4.5rem; 
            font-weight: 900; 
            color: var(--neon-rose); 
            text-shadow: 0 0 25px rgba(255, 0, 85, 0.4); 
            line-height: 1;
        }
        .big-score.safe { 
            color: var(--neon-green); 
            text-shadow: 0 0 25px rgba(57, 255, 20, 0.4); 
        }
        .grade-text { font-size: 1.3rem; font-weight: 700; margin-top: 10px; color: #fff; }

        /* Rows Layout */
        .header-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 16px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            font-size: 1rem; 
        }
        .header-row:last-child { border-bottom: none; }
        
        .badge { 
            font-weight: 800; 
            font-size: 0.8rem; 
            padding: 5px 14px; 
            border-radius: 4px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .badge.danger { background: rgba(255, 0, 85, 0.1); color: var(--neon-rose); border: 1px solid rgba(255, 0, 85, 0.3); box-shadow: 0 0 10px rgba(255, 0, 85, 0.1); }
        .badge.success { background: rgba(57, 255, 20, 0.1); color: var(--neon-green); border: 1px solid rgba(57, 255, 20, 0.3); box-shadow: 0 0 10px rgba(57, 255, 20, 0.1); }

        /* AI Executive Panel */
        .ai-panel { 
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(10, 10, 22, 0.95) 100%);
            border: 1px solid rgba(157, 78, 221, 0.3); 
            grid-column: 1 / -1; 
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.08);
        }
        .ai-panel h2::before { color: var(--neon-purple); }
        .ai-content { 
            white-space: pre-wrap; 
            line-height: 1.8; 
            color: #cbd5e1; 
            font-size: 1.05rem; 
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.02);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VDX AI // Cyber Auditor</h1>
        <p>Enterprise Automated Security Sytem Matrix // Web Scanner</p>
    </header>

    <div class="input-panel">
        <input type="text" id="targetUrl" placeholder="Audit manzilini kiriting (masalan: click.uz)...">
        <button id="startBtn" onclick="runAudit()">Skanerlash</button>
    </div>

    <div class="console-box" id="consoleBox"></div>

    <div class="results-wrapper" id="resultsWrapper">
        
        <div class="panel">
            <h2>Metrika va Infratuzilma</h2>
            <div class="score-box">
                <div class="big-score" id="scoreValue">00</div>
                <div class="grade-text" id="gradeValue">-</div>
                <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Umumiy Himoya Indeksi</div>
            </div>
            <div>
                <div class="header-row">
                    <div>
                        <div style="font-weight: 600;">OWASP A05 Matritsasi</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Security Misconfiguration</div>
                    </div>
                    <span class="badge" id="owaspA05">-</span>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>HTTP Sarlavhalari Auditi (Real-Time)</h2>
            <div id="headersList"></div>
        </div>

        <div class="panel ai-panel">
            <h2>🧠 Llama 3.3 Core Expert AI Analiz</h2>
            <div class="ai-content" id="aiAnalysisBody">Kiber-intellekt tahlil tayyorlamoqda...</div>
        </div>
        
    </div>
</div>

<script>
    // Sizning Render backend manzilingiz real ulandi
    const BACKEND_URL = "https://vdx-saas.onrender.com"; 

    async function runAudit() {
        const urlInput = document.getElementById('targetUrl').value.trim();
        if(!urlInput) return alert("Iltimos, sayt URL manzilini kiriting!");

        const consoleBox = document.getElementById('consoleBox');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const startBtn = document.getElementById('startBtn');

        consoleBox.style.display = "block";
        consoleBox.innerHTML = "";
        resultsWrapper.style.display = "none";
        startBtn.disabled = true;
        startBtn.innerText = "Skanerlanmoqda...";

        const logs = [
            "> [INIT] VDX Core Security Engine yuklanmoqda...",
            `> [TARGET] Nishon obyekt aniqlandi: ${urlInput}`,
            "> [NETWORK] HTTPS xavfsiz ulanish portallari tekshirilmoqda...",
            "> [SCAN] HTTP Security headers (CSP, X-Frame, HSTS) matni so'ralmoqda...",
            "> [COMPLIANCE] OWASP A05:2021 standartlari bo'yicha tahlil boshlandi...",
            "> [AI-GATEWAY] Skaner natijalari Llama 3.3 neyrotarmog'iga uzatilmoqda..."
        ];

        for (let i = 0; i < logs.length; i++) {
            await new Promise(r => setTimeout(r, 450));
            consoleBox.innerHTML += `<div class="console-line active">${logs[i]}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        try {
            const response = await fetch(`${BACKEND_URL}/api/audit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            if (!response.ok) throw new Error("Server ma'lumotlarni qayta ishlashda xatolikka yo'l qo'ydi.");
            const data = await response.json();

            // Ball va Darajani chiqarish
            document.getElementById('scoreValue').innerText = data.score;
            const scoreElement = document.getElementById('scoreValue');
            if(data.score >= 70) {
                scoreElement.className = "big-score safe";
            } else {
                scoreElement.className = "big-score";
            }
            
            document.getElementById('gradeValue').innerText = data.grade;

            // OWASP status yangilash
            const a05Badge = document.getElementById('owaspA05');
            a05Badge.innerText = data.owasp_matrix.A05;
            a05Badge.className = data.owasp_matrix.A05 === "XAVFSIZ" ? "badge success" : "badge danger";

            // Sarlavhalarni real chizish
            const headersList = document.getElementById('headersList');
            headersList.innerHTML = "";
            for (const [header, status] of Object.entries(data.headers)) {
                const isSafe = status.includes("XAVFSIZ");
                headersList.innerHTML += `
                    <div class="header-row">
                        <div>
                            <span style="font-weight: 600; font-family: monospace;">${header}</span>
                        </div>
                        <span class="badge ${isSafe ? 'success' : 'danger'}">${status}</span>
                    </div>
                `;
            }

            // AI matni
            document.getElementById('aiAnalysisBody').innerText = data.ai_analysis;
            
            // Dashboard oynasini ochish
            resultsWrapper.style.display = "grid";

        } catch (error) {
            consoleBox.innerHTML += `<div class="console-line" style="color: var(--neon-rose)">> [XATOLIK] Serverdan javob olishda uzilish: ${error.message}</div>`;
        } finally {
            startBtn.disabled = false;
            startBtn.innerText = "Skanerlash";
        }
    }
</script>
</body>
</html>
